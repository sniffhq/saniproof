<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SaniProof{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="topbar d-flex align-items-center justify-content-between">
    <a href="{{ url_for('dashboard.index') }}" class="topbar-brand">
      <i class="bi bi-shield-check"></i> SaniProof
    </a>
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('auth.logout') }}" class="topbar-logout">
        <i class="bi bi-box-arrow-right"></i> Log out
      </a>
    {% endif %}
  </nav>
  <div class="container simple-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, m in messages %}
          <div class="alert {{ 'alert-danger' if category == 'error' else 'alert-success' }} d-flex align-items-center gap-2">
            <i class="bi {{ 'bi-exclamation-circle' if category == 'error' else 'bi-check-circle' }}"></i> {{ m }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
