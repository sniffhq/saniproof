<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SaniProof{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark"><i class="bi bi-shield-check"></i></span>
        <span class="brand-text">SaniProof</span>
      </div>

      <div class="sidebar-company">
        <span class="sidebar-company-label">Company</span>
        <span class="sidebar-company-name">{{ company.name }}</span>
      </div>

      <nav class="sidebar-nav">
        <a href="{{ url_for('dashboard.company_dashboard', company_id=company.id) }}"
           class="nav-link {{ 'active' if active_nav == 'dashboard' else '' }}">
          <i class="bi bi-grid-1x2"></i> Dashboard
        </a>
        <a href="{{ url_for('tasks_admin.task_list', company_id=company.id) }}"
           class="nav-link {{ 'active' if active_nav == 'tasks' else '' }}">
          <i class="bi bi-list-check"></i> Tasks
        </a>
        <a href="{{ url_for('sops.sop_list', company_id=company.id) }}"
           class="nav-link {{ 'active' if active_nav == 'sops' else '' }}">
          <i class="bi bi-file-earmark-text"></i> SOPs
        </a>
        <a href="{{ url_for('clients.client_list', company_id=company.id) }}"
           class="nav-link {{ 'active' if active_nav == 'clients' else '' }}">
          <i class="bi bi-building"></i> Clients
        </a>
      </nav>

      <a href="{{ url_for('dashboard.index') }}" class="sidebar-switch">
        <i class="bi bi-arrow-left-right"></i> Switch company
      </a>
    </aside>

    <main class="main-content">
      <div class="main-inner">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for m in messages %}
              <div class="alert alert-success d-flex align-items-center gap-2">
                <i class="bi bi-check-circle"></i> {{ m }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
