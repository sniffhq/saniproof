{% extends "base.html" %}
{% block title %}Log in — SaniProof{% endblock %}
{% block content %}
<div class="landing-hero">
  <span class="brand-mark"><i class="bi bi-shield-check"></i></span>
  <h1 class="page-title">Log in</h1>
  <p class="page-subtitle">Company staff and client portal accounts both log in here.</p>
</div>

<div class="sp-card" style="max-width: 420px; margin: 0 auto;">
  <div class="sp-card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-accent w-100">
        <i class="bi bi-box-arrow-in-right"></i> Log in
      </button>
    </form>
  </div>
</div>
{% endblock %}
